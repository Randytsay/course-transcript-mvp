name: PR86 reviewer one-shot fix

on:
  push:
    branches:
      - feat/ai-subtitle-review

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[reviewer-fix-bootstrap]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/ai-subtitle-review
          fetch-depth: 0

      - name: Apply reviewer guards and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/subtitles/ai_review.py')
          text = path.read_text(encoding='utf-8')

          old = '''        for segment_id in cue_ids:\n            if segment_id not in baseline_index:\n                raise HTTPException(status_code=422, detail=f"cue 引用不存在的 segment: {segment_id}")\n            if segment_id not in ids:\n                raise HTTPException(status_code=422, detail=f"cue 超出候選範圍: {segment_id}")\n            seen_lineage.add(segment_id)\n'''
          new = '''        for segment_id in cue_ids:\n            if segment_id not in baseline_index:\n                raise HTTPException(status_code=422, detail=f"cue 引用不存在的 segment: {segment_id}")\n            if segment_id not in ids:\n                raise HTTPException(status_code=422, detail=f"cue 超出候選範圍: {segment_id}")\n            if segment_id in seen_lineage:\n                raise HTTPException(\n                    status_code=422,\n                    detail=f"同一 source segment 不可出現在多個 derived cues: {segment_id}",\n                )\n            seen_lineage.add(segment_id)\n'''
          if text.count(old) != 1:
              raise SystemExit('lineage patch anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''    replaced_segments: dict[str, list[dict[str, Any]]] = {}\n    for candidate in accepted:\n'''
          new = '''    # V1 cannot safely edit only part of an already merged/reflowed Active cue.\n    # A candidate that touches a multi-source Active cue must own its complete\n    # lineage, otherwise replacing one member would either drop the remaining\n    # members or trigger an internal lookup failure. Fail closed instead.\n    for candidate in accepted:\n        scope = {str(value) for value in candidate["source_segment_ids"]}\n        for base_cue in base_cues:\n            members = {str(value) for value in base_cue["source_segment_ids"]}\n            if scope & members and not members <= scope:\n                raise HTTPException(\n                    status_code=409,\n                    detail=(\n                        "候選僅涵蓋 Active multi-source cue 的部分 lineage；"\n                        f"必須完整包含 {sorted(members)}"\n                    ),\n                )\n\n    replaced_segments: dict[str, list[dict[str, Any]]] = {}\n    for candidate in accepted:\n'''
          if text.count(old) != 1:
              raise SystemExit('partial-lineage patch anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''    cues.sort(key=lambda item: (item["start_ms"], item["end_ms"]))\n    for index, cue in enumerate(cues, 1):\n        cue["cue_id"] = f"cue-{index:04d}"\n    return cues\n\n\ndef _timing_of'''
          new = '''    cues.sort(key=lambda item: (item["start_ms"], item["end_ms"]))\n    _validate_final_cues(cues)\n    for index, cue in enumerate(cues, 1):\n        cue["cue_id"] = f"cue-{index:04d}"\n    return cues\n\n\ndef _validate_final_cues(cues: list[dict[str, Any]]) -> None:\n    """Fail closed if a materialized revision has invalid timeline/lineage."""\n    previous_end: int | None = None\n    seen_lineage: set[str] = set()\n    for cue in cues:\n        start = int(cue["start_ms"])\n        end = int(cue["end_ms"])\n        if start >= end:\n            raise HTTPException(status_code=409, detail="字幕 cue 時間範圍無效")\n        if previous_end is not None and start < previous_end:\n            raise HTTPException(status_code=409, detail="字幕 cue 時間重疊，拒絕建立 Revision")\n        lineage = [str(value) for value in cue.get("source_segment_ids", [])]\n        if not lineage:\n            raise HTTPException(status_code=409, detail="字幕 cue 缺少 source lineage")\n        for segment_id in lineage:\n            if segment_id in seen_lineage:\n                raise HTTPException(\n                    status_code=409,\n                    detail=f"Final Revision 重複使用 source segment: {segment_id}",\n                )\n            seen_lineage.add(segment_id)\n        previous_end = end\n\n\ndef _timing_of'''
          if text.count(old) != 1:
              raise SystemExit('final-cue patch anchor mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_ai_subtitle_review_guards.py')
          test_path.write_text('''"""Regression guards for PR #86 AI subtitle review invariants."""\nfrom __future__ import annotations\n\nimport tempfile\nimport unittest\nfrom pathlib import Path\n\nfrom fastapi import HTTPException\n\nfrom app.subtitles import ai_review\n\n\nclass AIReviewGuardRegressionTests(unittest.TestCase):\n    def _index(self) -> dict[str, dict]:\n        return {\n            "seg-0001": {\n                "segment_id": "seg-0001", "raw_text": "甲", "working_text": "甲",\n                "start_ms": 0, "end_ms": 3000, "_index": 0,\n            },\n            "seg-0002": {\n                "segment_id": "seg-0002", "raw_text": "乙", "working_text": "乙",\n                "start_ms": 3000, "end_ms": 6000, "_index": 1,\n            },\n        }\n\n    def test_same_candidate_reused_lineage_is_rejected(self) -> None:\n        proposal = ai_review.CandidateProposal(\n            change_type="cross_segment_reflow",\n            source_segment_ids=["seg-0001", "seg-0002"],\n            before=[\n                {"segment_id": "seg-0001", "text": "甲"},\n                {"segment_id": "seg-0002", "text": "乙"},\n            ],\n            after=[\n                {"source_segment_ids": ["seg-0001"], "text": "甲"},\n                {"source_segment_ids": ["seg-0001", "seg-0002"], "text": "乙"},\n            ],\n            reason="regression for reused lineage", confidence=0.9,\n            risk="medium", high_review_required=True,\n        )\n        with self.assertRaises(HTTPException) as caught:\n            ai_review._validate_candidate(proposal, self._index())\n        self.assertEqual(caught.exception.status_code, 422)\n        self.assertIn("不可出現在多個", caught.exception.detail)\n\n    def test_final_cue_overlap_is_rejected(self) -> None:\n        cues = [\n            {"text": "甲", "source_segment_ids": ["seg-0001"], "start_ms": 0, "end_ms": 3000},\n            {"text": "乙", "source_segment_ids": ["seg-0002"], "start_ms": 2500, "end_ms": 6000},\n        ]\n        with self.assertRaises(HTTPException) as caught:\n            ai_review._validate_final_cues(cues)\n        self.assertEqual(caught.exception.status_code, 409)\n        self.assertIn("時間重疊", caught.exception.detail)\n\n    def test_partial_edit_of_active_multi_source_cue_fails_closed(self) -> None:\n        with tempfile.TemporaryDirectory() as tmp:\n            directory = Path(tmp)\n            state = {\n                "revision": 1, "active_revision": 1, "candidates": [],\n                "revisions": [{\n                    "revision": 1,\n                    "cues": [{\n                        "cue_id": "cue-0001", "text": "甲乙",\n                        "source_segment_ids": ["seg-0001", "seg-0002"],\n                        "start_ms": 0, "end_ms": 6000,\n                    }],\n                }],\n            }\n            accepted = [{\n                "change_id": "cand-partial", "source_segment_ids": ["seg-0001"],\n                "after": [{"source_segment_ids": ["seg-0001"], "text": "甲改"}],\n            }]\n            with self.assertRaises(HTTPException) as caught:\n                ai_review._resolve_cues(directory, state, accepted)\n            self.assertEqual(caught.exception.status_code, 409)\n            self.assertIn("部分 lineage", caught.exception.detail)\n\n    def test_full_lineage_edit_of_active_multi_source_cue_is_allowed(self) -> None:\n        with tempfile.TemporaryDirectory() as tmp:\n            directory = Path(tmp)\n            state = {\n                "revision": 1, "active_revision": 1, "candidates": [],\n                "revisions": [{\n                    "revision": 1,\n                    "cues": [{\n                        "cue_id": "cue-0001", "text": "甲乙",\n                        "source_segment_ids": ["seg-0001", "seg-0002"],\n                        "start_ms": 0, "end_ms": 6000,\n                    }],\n                }],\n            }\n            accepted = [{\n                "change_id": "cand-full",\n                "source_segment_ids": ["seg-0001", "seg-0002"],\n                "after": [{\n                    "source_segment_ids": ["seg-0001", "seg-0002"],\n                    "text": "甲乙改",\n                }],\n            }]\n            cues = ai_review._resolve_cues(directory, state, accepted)\n            self.assertEqual(len(cues), 1)\n            self.assertEqual(cues[0]["text"], "甲乙改")\n            self.assertEqual(cues[0]["source_segment_ids"], ["seg-0001", "seg-0002"])\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

          python -m py_compile app/subtitles/ai_review.py tests/test_ai_subtitle_review_guards.py

      - name: Commit reviewer fixes and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "ChatGPT Reviewer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr86-reviewer-fix.yml
          git add app/subtitles/ai_review.py tests/test_ai_subtitle_review_guards.py
          git commit -m "fix(subtitles): enforce lineage and timeline invariants"
          git push origin HEAD:feat/ai-subtitle-review
