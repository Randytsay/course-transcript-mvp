name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg rclone
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Import production API entrypoint
        run: python -c "from app.api_observed import app; assert app.title"
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

  frontend:
    name: Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Create placeholder secret files for model validation
        run: |
          touch /tmp/rclone.conf /tmp/gcp-sa.json /tmp/billing-sa.json
      - name: Validate web profile
        env:
          RCLONE_CONFIG_HOST_PATH: /tmp/rclone.conf
          BILLING_CREDENTIALS_HOST_PATH: /tmp/billing-sa.json
        run: docker compose --profile web config --quiet
      - name: Validate billing profile
        env:
          RCLONE_CONFIG_HOST_PATH: /tmp/rclone.conf
          BILLING_CREDENTIALS_HOST_PATH: /tmp/billing-sa.json
        run: docker compose --profile billing config --quiet
