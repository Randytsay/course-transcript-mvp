name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg rclone
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest
      - name: Compile Python sources
        run: |
          python -m compileall -q app tests
          python -m py_compile scripts/diagnose_delivery_candidate.py
      - name: Validate shell scripts
        run: bash -n scripts/smoke_drive_api_readonly.sh
      - name: Import production API and worker entrypoints
        run: |
          python -c "from app.api_hardened import app; assert app.title"
          python -c "import app.pipeline.dynamic_worker_production"
          python -c "import app.jobs.delivery_worker"
      - name: Run pytest-only handoff tests
        run: python -m pytest -q tests/test_chatgpt_handoff.py
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

  frontend:
    name: Next.js tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Run frontend behavior tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  image:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build application image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg TARGETARCH=amd64 \
            --build-arg RCLONE_RELEASE=1.74.0 \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --tag course-transcript-ci:${GITHUB_SHA} \
            .
      - name: Build frontend image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --tag course-transcript-frontend-ci:${GITHUB_SHA} \
            ./frontend
      - name: Verify rclone and revision labels
        run: |
          docker run --rm --entrypoint rclone \
            course-transcript-ci:${GITHUB_SHA} version \
            | grep -F 'rclone v1.74.0'
          test "$(docker image inspect course-transcript-ci:${GITHUB_SHA} --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${GITHUB_SHA}"
          test "$(docker image inspect course-transcript-frontend-ci:${GITHUB_SHA} --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${GITHUB_SHA}"

      - name: Verify packaged V2 daemon entrypoints without network or credentials
        run: |
          for script in golden_v2_worker_daemon golden_v2_batch_intake_daemon golden_v2_paid_executor_daemon golden_v2_owner_client golden_v2_reconcile_no_dispatch; do
            docker run --rm --network none --entrypoint python \
              course-transcript-ci:${GITHUB_SHA} "scripts/${script}.py" --help
          done

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Create placeholder secret files for model validation
        run: |
          touch /tmp/live.env /tmp/rclone.conf /tmp/billing-sa.json
          mkdir -p /tmp/ai-runtime /tmp/ai-accounts /tmp/pr10-smoke-data
          touch /tmp/ai-runtime/gcp-sa.json
          mkdir -p /tmp/release-state/data /tmp/release-state/logs /tmp/release-state/tmp
      - name: Validate web profile
        env:
          RCLONE_CONFIG_HOST_PATH: /tmp/rclone.conf
          BILLING_CREDENTIALS_HOST_PATH: /tmp/billing-sa.json
        run: docker compose --profile web config --quiet
      - name: Validate billing profile
        env:
          RCLONE_CONFIG_HOST_PATH: /tmp/rclone.conf
          BILLING_CREDENTIALS_HOST_PATH: /tmp/billing-sa.json
        run: docker compose --profile billing config --quiet
      - name: Validate immutable release override
        env:
          COURSE_TRANSCRIPT_RELEASE_TAG: ci-release
          COURSE_TRANSCRIPT_ENV_FILE: /tmp/live.env
          COURSE_TRANSCRIPT_TARGETARCH: arm64
          RCLONE_RELEASE: 1.74.0
          COURSE_TRANSCRIPT_DATA_HOST_PATH: /tmp/release-state/data
          COURSE_TRANSCRIPT_LOGS_HOST_PATH: /tmp/release-state/logs
          COURSE_TRANSCRIPT_TMP_HOST_PATH: /tmp/release-state/tmp
          AI_RUNTIME_HOST_DIR: /tmp/ai-runtime
          AI_ACCOUNTS_DIR: /tmp/ai-accounts
          RCLONE_CONFIG_HOST_PATH: /tmp/rclone.conf
          GOOGLE_DRIVE_REFRESH_TOKEN_HOST_PATH: /dev/null
          BILLING_CREDENTIALS_HOST_PATH: /tmp/billing-sa.json
        run: |
          docker compose \
            -p course-transcript-source \
            -f docker-compose.yml \
            -f docker-compose.release.yml \
            --profile web \
            --profile billing \
            config --format json > /tmp/release-compose.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('/tmp/release-compose.json').read_text())
          services = payload.get('services') or {}
          required = {
              'api', 'worker', 'pipeline-worker', 'delivery-worker',
              'billing-worker', 'frontend',
          }
          assert required.issubset(services), services.keys()

          backend = (
              'infrastructure-test',
              'api',
              'worker',
              'pipeline-worker',
              'delivery-worker',
              'billing-worker',
          )
          for name in backend:
              service = services[name]
              args = (service.get('build') or {}).get('args') or {}
              assert args.get('VCS_REF') == 'ci-release', (name, args)
              assert args.get('TARGETARCH') == 'arm64', (name, args)
              assert str(args.get('RCLONE_RELEASE')) == '1.74.0', (name, args)
              assert str(service.get('image', '')).endswith(':ci-release')

          frontend = services['frontend']
          frontend_args = (frontend.get('build') or {}).get('args') or {}
          assert frontend_args.get('VCS_REF') == 'ci-release', frontend_args
          assert str(frontend.get('image', '')).endswith(':ci-release')

          data_sources = {}
          for name in ('api', 'worker', 'pipeline-worker', 'delivery-worker', 'billing-worker'):
              volume = next(item for item in services[name].get('volumes', []) if item.get('target') == '/app/data')
              data_sources[name] = volume.get('source')
          assert set(data_sources.values()) == {'/tmp/release-state/data'}, data_sources

          api_volumes = services['api'].get('volumes', [])
          api_runtime = next(
              item for item in api_volumes if item.get('target') == '/run/ai-runtime'
          )
          assert api_runtime.get('read_only') is not True
          api_accounts = next(
              item for item in api_volumes
              if item.get('target') == os.environ['AI_ACCOUNTS_DIR']
          )
          assert api_accounts.get('read_only') is not True
          pipeline_runtime = next(
              item for item in services['pipeline-worker'].get('volumes', [])
              if item.get('target') == '/run/ai-runtime'
          )
          assert pipeline_runtime.get('read_only') is True
          assert (
              (services['pipeline-worker'].get('environment') or {}).get(
                  'GOOGLE_APPLICATION_CREDENTIALS'
              ) == '/run/ai-runtime/gcp-sa.json'
          )

          infrastructure = services['infrastructure-test']
          assert (
              (infrastructure.get('environment') or {}).get(
                  'GOOGLE_APPLICATION_CREDENTIALS'
              ) == '/run/ai-runtime/gcp-sa.json'
          )
          infrastructure_runtime = next(
              item for item in infrastructure.get('volumes', [])
              if item.get('target') == '/run/ai-runtime'
          )
          assert infrastructure_runtime.get('read_only') is True

          retention = services['retention-monitor']
          assert (
              (retention.get('environment') or {}).get(
                  'GOOGLE_APPLICATION_CREDENTIALS'
              ) == '/run/ai-runtime/gcp-sa.json'
          )
          retention_runtime = next(
              item for item in retention.get('volumes', [])
              if item.get('target') == '/run/ai-runtime'
          )
          assert retention_runtime.get('read_only') is True

          for name in ('api', 'worker', 'pipeline-worker', 'delivery-worker'):
              rclone = next(
                  item for item in services[name].get('volumes', [])
                  if item.get('target') == '/run/secrets/rclone.conf'
              )
              assert rclone.get('source') == '/tmp/rclone.conf'
              assert rclone.get('read_only') is True

          ports = frontend.get('ports') or []
          assert len(ports) == 1
          assert ports[0].get('host_ip') == '127.0.0.1'
          assert ports[0].get('published') == '3300'
          assert ports[0].get('target') == 3000
          PY
      - name: Validate isolated Drive API smoke definition
        env:
          PR10_SMOKE_GIT_SHA: ci-validation
          PR10_SMOKE_DATA_DIR: /tmp/pr10-smoke-data
          PR10_SMOKE_IMAGE: course-transcript-pr10-smoke:ci
          RCLONE_CONFIG_HOST_PATH: /tmp/rclone.conf
        run: |
          docker compose \
            -p course-transcript-pr10-smoke \
            -f docker-compose.smoke.yml \
            config --quiet
          docker compose \
            -p course-transcript-pr10-smoke \
            -f docker-compose.smoke.yml \
            config --format json > /tmp/pr10-smoke-compose.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/pr10-smoke-compose.json').read_text())
          services = payload.get('services') or {}
          assert set(services) == {'api'}, services.keys()
          api = services['api']
          assert api.get('platform') == 'linux/arm64'
          assert api.get('read_only') is True
          assert not api.get('ports')
          environment = api.get('environment') or {}
          assert environment.get('COURSE_TRANSCRIPT_DRIVE_BROWSER_PROVIDER') == 'google_api'
          assert environment.get('COURSE_TRANSCRIPT_DRIVE_BROWSER_FALLBACK') == 'false'
          assert not environment.get('GOOGLE_APPLICATION_CREDENTIALS')
          volumes = api.get('volumes') or []
          rclone = next(item for item in volumes if item.get('target') == '/run/secrets/rclone.conf')
          assert rclone.get('read_only') is True
          data = next(item for item in volumes if item.get('target') == '/app/data')
          assert data.get('source') == '/tmp/pr10-smoke-data'
          assert all('gcp-sa.json' not in str(item) for item in volumes)
          PY
      - name: Ensure V2 paid recognition and Drive publication require explicit opt-in
        env:
          V2_CHAT_RELEASE_SHA: ci-v2-release
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          base = [
              'docker', 'compose', '-p', 'course-transcript-v2-ci',
              '-f', 'deploy/golden-v2-chat-compose.yml',
              '-f', 'deploy/golden-v2-paid-compose.yml',
          ]

          def render(profiles=(), **overrides):
              command = [*base]
              for profile in profiles:
                  command.extend(['--profile', profile])
              command.extend(['config', '--no-env-resolution', '--format', 'json'])
              env = os.environ.copy()
              env.update(overrides)
              return json.loads(subprocess.check_output(command, env=env, text=True))

          default = render()
          assert set(default['services']) == {'api', 'intake'}
          api = default['services']['api']
          assert api['environment']['COURSE_TRANSCRIPT_V2_PAID_API_ENABLED'] == 'false'
          assert api['environment']['COURSE_TRANSCRIPT_V2_PUBLISH_API_ENABLED'] == 'false'
          assert api['ports'][0]['host_ip'] == '127.0.0.1'

          opted_in = render(
              ('v2-paid', 'v2-publish'),
              V2_CHAT_PAID_API_ENABLED='true',
              V2_CHAT_PUBLISH_API_ENABLED='true',
          )
          services = opted_in['services']
          assert set(services) == {'api', 'intake', 'paid', 'delivery'}
          assert services['api']['environment']['COURSE_TRANSCRIPT_V2_PAID_API_ENABLED'] == 'true'
          assert services['api']['environment']['COURSE_TRANSCRIPT_V2_PUBLISH_API_ENABLED'] == 'true'
          assert services['paid']['profiles'] == ['v2-paid']
          assert services['delivery']['profiles'] == ['v2-publish']
          data_mounts = {
              name: next(v for v in service['volumes'] if v['target'] == '/app/data')['source']
              for name, service in services.items()
          }
          assert len(set(data_mounts.values())) == 1, data_mounts
          for service in services.values():
              drive_config = next(
                  v for v in service['volumes']
                  if v['target'] == '/run/secrets/rclone.conf'
              )
              assert drive_config['read_only'] is True
          PY
