name: Reviewer hardening PR43

on:
  push:
    branches:
      - codex/phase-b-minimax-m3-reasoning-split

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/phase-b-minimax-m3-reasoning-split
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply reviewer hardening
        run: python scripts/reviewer_patch_pr43.py
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Focused regression tests
        run: |
          python -m unittest tests.test_minimax_provider tests.test_performance_enhanced_regressions -v
          python -m compileall -q app tests
          git diff --check
      - name: Commit reviewer hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/providers/minimax_provider.py app/jobs/performance.py app/jobs/performance_enhanced.py tests/test_minimax_provider.py tests/test_performance_enhanced_regressions.py docs/M3_PHASE_B_VALIDATION_20260817.md
          git commit -m "fix: harden MiniMax transport and reasoning observability"
          git push origin HEAD:codex/phase-b-minimax-m3-reasoning-split
