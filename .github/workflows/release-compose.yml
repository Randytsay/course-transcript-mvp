name: Release Compose

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-compose:
    name: Release env, state, and provenance validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Create safe placeholders
        run: |
          printf 'RELEASE_ENV_SENTINEL=loaded\n' > /tmp/live.env
          touch /tmp/rclone.conf /tmp/gcp-sa.json /tmp/billing-sa.json
          mkdir -p /tmp/release-state/data /tmp/release-state/logs /tmp/release-state/tmp
          mkdir -p /tmp/ai-runtime
      - name: Render release model
        env:
          COURSE_TRANSCRIPT_RELEASE_TAG: ci-release
          COURSE_TRANSCRIPT_ENV_FILE: /tmp/live.env
          COURSE_TRANSCRIPT_TARGETARCH: arm64
          RCLONE_RELEASE: 1.74.0
          COURSE_TRANSCRIPT_DATA_HOST_PATH: /tmp/release-state/data
          COURSE_TRANSCRIPT_LOGS_HOST_PATH: /tmp/release-state/logs
          COURSE_TRANSCRIPT_TMP_HOST_PATH: /tmp/release-state/tmp
          GCP_CREDENTIALS_HOST_PATH: /tmp/gcp-sa.json
          RCLONE_CONFIG_HOST_PATH: /tmp/rclone.conf
          GOOGLE_DRIVE_REFRESH_TOKEN_HOST_PATH: /dev/null
          BILLING_CREDENTIALS_HOST_PATH: /tmp/billing-sa.json
        run: |
          docker compose \
            -p course-transcript-source \
            -f docker-compose.yml \
            -f docker-compose.release.yml \
            --profile web \
            --profile billing \
            config --format json > /tmp/release-compose.json
      - name: Verify protected env, mounts, and build provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          model = json.loads(Path('/tmp/release-compose.json').read_text())
          services = model['services']

          for name in ('infrastructure-test', 'api', 'billing-worker'):
              environment = services[name].get('environment') or {}
              assert environment.get('RELEASE_ENV_SENTINEL') == 'loaded', (
                  name,
                  sorted(environment),
              )

          backend = (
              'infrastructure-test',
              'api',
              'worker',
              'pipeline-worker',
              'delivery-worker',
              'billing-worker',
          )
          for name in backend:
              service = services[name]
              args = (service.get('build') or {}).get('args') or {}
              assert args.get('VCS_REF') == 'ci-release', (name, args)
              assert args.get('TARGETARCH') == 'arm64', (name, args)
              assert str(args.get('RCLONE_RELEASE')) == '1.74.0', (name, args)
              assert str(service.get('image', '')).endswith(':ci-release')

          frontend = services['frontend']
          frontend_args = (frontend.get('build') or {}).get('args') or {}
          assert frontend_args.get('VCS_REF') == 'ci-release', frontend_args
          assert str(frontend.get('image', '')).endswith(':ci-release')

          data_sources = {}
          for name in ('api', 'worker', 'pipeline-worker', 'delivery-worker', 'billing-worker'):
              data = next(
                  item for item in services[name]['volumes']
                  if item.get('target') == '/app/data'
              )
              data_sources[name] = data.get('source')
          assert set(data_sources.values()) == {'/tmp/release-state/data'}, data_sources

          assert all(
              'gcp-sa.json' not in str(item)
              for item in services['api'].get('volumes', [])
          )

          for name in ('infrastructure-test', 'pipeline-worker'):
              service = services[name]
              environment = service.get('environment') or {}
              assert environment.get('GOOGLE_APPLICATION_CREDENTIALS') == (
                  '/run/ai-runtime/gcp-sa.json'
              ), (name, environment)
              runtime = next(
                  item for item in service.get('volumes', [])
                  if item.get('target') == '/run/ai-runtime'
              )
              assert runtime.get('read_only') is True, (name, runtime)

          retention = services['retention-monitor']
          retention_environment = retention.get('environment') or {}
          assert retention_environment.get('GOOGLE_APPLICATION_CREDENTIALS') == (
              '/run/secrets/gcp-sa.json'
          ), retention_environment
          retention_gcp = next(
              item for item in retention.get('volumes', [])
              if item.get('target') == '/run/secrets/gcp-sa.json'
          )
          assert retention_gcp.get('read_only') is True, retention_gcp
          PY
      - name: Render retranscription worker overlay
        env:
          AI_RUNTIME_HOST_DIR: /tmp/ai-runtime
          RCLONE_CONFIG_HOST_PATH: /tmp/rclone.conf
          GOOGLE_DRIVE_REFRESH_TOKEN_HOST_PATH: /dev/null
          MINIMAX_API_KEY_HOST_PATH: /dev/null
          ASR_RETRANSCRIPTION_ENABLED: "false"
        run: |
          docker compose \
            -p course-transcript-retranscription-ci \
            -f docker-compose.yml \
            -f docker-compose.retranscription.yml \
            --profile web \
            config --format json > /tmp/retranscription-compose.json
      - name: Verify retranscription worker is gated by default
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          model = json.loads(Path('/tmp/retranscription-compose.json').read_text())
          worker = model['services']['retranscription-worker']
          environment = worker.get('environment') or {}
          command = worker.get('command') or []

          assert environment.get('ASR_RETRANSCRIPTION_ENABLED') == 'false', environment
          assert command == [
              'python', '-m', 'app.jobs.retranscription_worker_entry'
          ], command
          assert environment.get('GOOGLE_APPLICATION_CREDENTIALS') == (
              '/run/ai-runtime/gcp-sa.json'
          ), environment
          runtime = next(
              item for item in worker.get('volumes', [])
              if item.get('target') == '/run/ai-runtime'
          )
          assert runtime.get('read_only') is True, runtime
          PY
