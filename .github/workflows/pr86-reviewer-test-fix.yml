name: PR86 reviewer test alignment

on:
  push:
    branches:
      - feat/ai-subtitle-review

permissions:
  contents: write

jobs:
  patch-tests:
    if: contains(github.event.head_commit.message, '[reviewer-test-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/ai-subtitle-review
          fetch-depth: 0

      - name: Align legacy tests with unique lineage invariant
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_ai_subtitle_review.py')
          text = path.read_text(encoding='utf-8')

          old = '''                after=[\n                    {"source_segment_ids": ["seg-0001"], "text": "所以我們今天要講的是"},\n                    {"source_segment_ids": ["seg-0001", "seg-0002"], "text": "彌勒大成佛經裡面這個內容"},\n                ],\n                reason="完整專有名詞被 ASR boundary 切開",\n            )\n        )\n        self.assertEqual(len(record["after"]), 2)\n        self.assertEqual(record["after"][1]["source_segment_ids"], ["seg-0001", "seg-0002"])\n'''
          new = '''                after=[\n                    {"source_segment_ids": ["seg-0001"], "text": "所以我們今天要講的是"},\n                    {"source_segment_ids": ["seg-0002"], "text": "彌勒大成佛經裡面這個內容"},\n                ],\n                reason="完整專有名詞被 ASR boundary 切開",\n            )\n        )\n        self.assertEqual(len(record["after"]), 2)\n        self.assertEqual(record["after"][1]["source_segment_ids"], ["seg-0002"])\n'''
          if text.count(old) != 1:
              raise SystemExit('adjacent-word-split test anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''                after=[\n                    {"source_segment_ids": ["seg-0001"], "text": "所以我們今天要講的是"},\n                    {"source_segment_ids": ["seg-0001", "seg-0002"], "text": "彌勒大成佛經裡面這個內容"},\n                ],\n                reason="reflow",\n            )\n        )\n        reflow["status"] = "accepted"\n        state = ai_review._review_state(self.job_dir)\n        cues = ai_review._resolve_cues(self.job_dir, state, [reflow])\n        lineage = {tuple(cue["source_segment_ids"]) for cue in cues}\n        self.assertIn(("seg-0001",), lineage)\n        self.assertIn(("seg-0001", "seg-0002"), lineage)\n        merged_cue = next(cue for cue in cues if len(cue["source_segment_ids"]) == 2)\n        self.assertEqual(merged_cue["start_ms"], 3000 - 3000)\n        self.assertEqual(merged_cue["end_ms"], 6000)\n'''
          new = '''                after=[\n                    {"source_segment_ids": ["seg-0001"], "text": "所以我們今天要講的是"},\n                    {"source_segment_ids": ["seg-0002"], "text": "彌勒大成佛經裡面這個內容"},\n                ],\n                reason="reflow",\n            )\n        )\n        reflow["status"] = "accepted"\n        state = ai_review._review_state(self.job_dir)\n        cues = ai_review._resolve_cues(self.job_dir, state, [reflow])\n        lineage = {tuple(cue["source_segment_ids"]) for cue in cues}\n        self.assertIn(("seg-0001",), lineage)\n        self.assertIn(("seg-0002",), lineage)\n        second_cue = next(cue for cue in cues if cue["source_segment_ids"] == ["seg-0002"])\n        self.assertEqual(second_cue["start_ms"], 3000)\n        self.assertEqual(second_cue["end_ms"], 6000)\n'''
          if text.count(old) != 1:
              raise SystemExit('resolved-lineage test anchor mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_ai_subtitle_review_flow.py')
          text = path.read_text(encoding='utf-8')
          old = '''                "after": [\n                    {"source_segment_ids": ["seg-0001"], "text": "第一句"},\n                    {"source_segment_ids": ["seg-0001", "seg-0002"], "text": "第一句第二句"},\n                ],\n                "reason": "reflow", "confidence": 0.9, "risk": "low",\n'''
          new = '''                "after": [\n                    {"source_segment_ids": ["seg-0001", "seg-0002"], "text": "第一句第二句"},\n                ],\n                "reason": "reflow", "confidence": 0.9, "risk": "low",\n'''
          if text.count(old) != 1:
              raise SystemExit('cross-speaker endpoint test anchor mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile tests/test_ai_subtitle_review.py tests/test_ai_subtitle_review_flow.py

      - name: Commit aligned tests and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "ChatGPT Reviewer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr86-reviewer-test-fix.yml
          git add tests/test_ai_subtitle_review.py tests/test_ai_subtitle_review_flow.py
          git commit -m "test(subtitles): align reflow cases with unique lineage"
          git push origin HEAD:feat/ai-subtitle-review
