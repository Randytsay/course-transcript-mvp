services:
  infrastructure-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: course-transcript-infrastructure-test:local
    env_file:
      - path: .env
        required: false
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
      CHIRP_DYNAMIC_BATCHING: ${CHIRP_DYNAMIC_BATCHING:-true}
    volumes:
      - /opt/course-transcript/secrets/gcp-sa.json:/run/secrets/gcp-sa.json:ro
      - ./logs:/app/logs
      - ./tmp:/app/tmp
      - ./data:/app/data
    command: []

  api:
    profiles: ["web"]
    build:
      context: .
      dockerfile: Dockerfile
    image: course-transcript-api:local
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      - path: .env
        required: false
      - path: ${AI_RUNTIME_DIR:-/opt/course-transcript/secrets/ai-runtime}/ai-active.env
        required: false
    environment:
      COURSE_TRANSCRIPT_DATA_DIR: /app/data
      COURSE_TRANSCRIPT_CORS_ORIGINS: http://localhost:3000
      COURSE_TRANSCRIPT_COST_LIMIT_USD: "200"
      COURSE_TRANSCRIPT_COST_WARNING_THRESHOLDS_USD: "50,100,160,190"
      COURSE_TRANSCRIPT_BUDGET_REMAINING_TWD: ${COURSE_TRANSCRIPT_BUDGET_REMAINING_TWD:-1200}
      COURSE_TRANSCRIPT_USD_TO_TWD: ${COURSE_TRANSCRIPT_USD_TO_TWD:-32}
      COURSE_TRANSCRIPT_BUDGET_BASELINE_COMMITTED_USD: ${COURSE_TRANSCRIPT_BUDGET_BASELINE_COMMITTED_USD:-132.6374}
      COURSE_TRANSCRIPT_FX_AUTO_ENABLED: ${COURSE_TRANSCRIPT_FX_AUTO_ENABLED:-true}
      COURSE_TRANSCRIPT_FX_URL: ${COURSE_TRANSCRIPT_FX_URL:-https://cpx.cbc.gov.tw/api/OpenData/FTDOpenData_Day}
      COURSE_TRANSCRIPT_FX_CACHE_TTL_SECONDS: ${COURSE_TRANSCRIPT_FX_CACHE_TTL_SECONDS:-86400}
      COURSE_TRANSCRIPT_FX_MAX_STALE_SECONDS: ${COURSE_TRANSCRIPT_FX_MAX_STALE_SECONDS:-259200}
      COURSE_TRANSCRIPT_FX_TIMEOUT_SECONDS: ${COURSE_TRANSCRIPT_FX_TIMEOUT_SECONDS:-5}
      COURSE_TRANSCRIPT_FX_CACHE_PATH: ${COURSE_TRANSCRIPT_FX_CACHE_PATH:-/app/data/fx/usd-twd.json}
      COURSE_TRANSCRIPT_ALLOWED_SOURCE_PREFIX: "gdrive:"
      COURSE_TRANSCRIPT_BATCH_MAX_FILES: "100"
      COURSE_TRANSCRIPT_DRIVE_BROWSE_MAX_ENTRIES: "500"
      COURSE_TRANSCRIPT_DRIVE_BROWSE_CACHE_SECONDS: "60"
      COURSE_TRANSCRIPT_DRIVE_BROWSER_PROVIDER: ${COURSE_TRANSCRIPT_DRIVE_BROWSER_PROVIDER:-google_api}
      COURSE_TRANSCRIPT_DRIVE_BROWSER_FALLBACK: ${COURSE_TRANSCRIPT_DRIVE_BROWSER_FALLBACK:-true}
      COURSE_TRANSCRIPT_DRIVE_REMOTE: ${COURSE_TRANSCRIPT_DRIVE_REMOTE:-gdrive}
      GOOGLE_DRIVE_PAGE_SIZE: ${GOOGLE_DRIVE_PAGE_SIZE:-200}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${GOOGLE_DRIVE_REFRESH_TOKEN:-}
      GOOGLE_DRIVE_REFRESH_TOKEN_FILE: ${GOOGLE_DRIVE_REFRESH_TOKEN_FILE:-}
      COURSE_TRANSCRIPT_RCLONE_FAST_LIST: "false"
      COURSE_TRANSCRIPT_REQUIRE_ACCESS_HEADERS: "true"
      COURSE_TRANSCRIPT_PUBLIC_ORIGIN: "https://transcript.randy88.ccwu.cc"
      CHIRP_DYNAMIC_BATCHING: ${CHIRP_DYNAMIC_BATCHING:-true}
      BILLING_SNAPSHOT_STALE_SECONDS: ${BILLING_SNAPSHOT_STALE_SECONDS:-3600}
      RCLONE_CONFIG: /run/secrets/rclone.conf
      MINIMAX_M3_ENABLED: ${MINIMAX_M3_ENABLED:-false}
      MINIMAX_M3_QUOTA_CHECK_ENABLED: ${MINIMAX_M3_QUOTA_CHECK_ENABLED:-false}
      MINIMAX_M3_MODEL: ${MINIMAX_M3_MODEL:-MiniMax-M3}
      MINIMAX_M3_INVALID_RESPONSE_MAX_ATTEMPTS: ${MINIMAX_M3_INVALID_RESPONSE_MAX_ATTEMPTS:-2}
      MINIMAX_M3_QUOTA_URL: ${MINIMAX_M3_QUOTA_URL:-https://api.minimaxi.com/v1/token_plan/remains}
      MINIMAX_M3_API_PATH: ${MINIMAX_M3_API_PATH:-/v1/chat/completions}
      MINIMAX_API_BASE_URL: ${MINIMAX_API_BASE_URL:-https://api.minimaxi.com}
      MINIMAX_API_KEY_FILE: /run/secrets/minimax-api-key
      GOOGLE_APPLICATION_CREDENTIALS: /run/ai-runtime/gcp-sa.json
      AI_RUNTIME_DIR: ${AI_RUNTIME_DIR:-/opt/course-transcript/secrets/ai-runtime}
      AI_ACCOUNTS_DIR: ${AI_ACCOUNTS_DIR:-/opt/course-transcript/secrets/ai-accounts}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs:ro
      - ${RCLONE_CONFIG_HOST_PATH:-/home/ubuntu/.config/rclone/rclone.conf}:/run/secrets/rclone.conf:ro
      - ${GOOGLE_DRIVE_REFRESH_TOKEN_HOST_PATH:-/dev/null}:/run/secrets/google-drive-refresh-token:ro
      - ${MINIMAX_API_KEY_HOST_PATH:-/opt/course-transcript/secrets/minimax-api-key}:/run/secrets/minimax-api-key:ro
      # AI account profile state — ONLY this subtree is writable by the API.
      - ${AI_ACCOUNTS_DIR:-/opt/course-transcript/secrets/ai-accounts}:${AI_ACCOUNTS_DIR:-/opt/course-transcript/secrets/ai-accounts}
      - ${AI_RUNTIME_DIR:-/opt/course-transcript/secrets/ai-runtime}:${AI_RUNTIME_DIR:-/opt/course-transcript/secrets/ai-runtime}
    command: ["uvicorn", "app.api_hardened:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    profiles: ["web"]
    build:
      context: .
      dockerfile: Dockerfile
    image: course-transcript-worker:local
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      COURSE_TRANSCRIPT_DATA_DIR: /app/data
      COURSE_TRANSCRIPT_COST_LIMIT_USD: "200"
      COURSE_TRANSCRIPT_COST_WARNING_THRESHOLDS_USD: "50,100,160,190"
      COURSE_TRANSCRIPT_BUDGET_REMAINING_TWD: ${COURSE_TRANSCRIPT_BUDGET_REMAINING_TWD:-1200}
      COURSE_TRANSCRIPT_USD_TO_TWD: ${COURSE_TRANSCRIPT_USD_TO_TWD:-32}
      COURSE_TRANSCRIPT_BUDGET_BASELINE_COMMITTED_USD: ${COURSE_TRANSCRIPT_BUDGET_BASELINE_COMMITTED_USD:-132.6374}
      COURSE_TRANSCRIPT_FX_AUTO_ENABLED: ${COURSE_TRANSCRIPT_FX_AUTO_ENABLED:-true}
      COURSE_TRANSCRIPT_FX_URL: ${COURSE_TRANSCRIPT_FX_URL:-https://cpx.cbc.gov.tw/api/OpenData/FTDOpenData_Day}
      COURSE_TRANSCRIPT_FX_CACHE_TTL_SECONDS: ${COURSE_TRANSCRIPT_FX_CACHE_TTL_SECONDS:-86400}
      COURSE_TRANSCRIPT_FX_MAX_STALE_SECONDS: ${COURSE_TRANSCRIPT_FX_MAX_STALE_SECONDS:-259200}
      COURSE_TRANSCRIPT_FX_TIMEOUT_SECONDS: ${COURSE_TRANSCRIPT_FX_TIMEOUT_SECONDS:-5}
      COURSE_TRANSCRIPT_FX_CACHE_PATH: ${COURSE_TRANSCRIPT_FX_CACHE_PATH:-/app/data/fx/usd-twd.json}
      COURSE_TRANSCRIPT_MINIMUM_FREE_SPACE_GB: "3"
      COURSE_TRANSCRIPT_WORKER_ID: "preflight-worker-1"
      CHIRP_DYNAMIC_BATCHING: ${CHIRP_DYNAMIC_BATCHING:-true}
      RCLONE_CONFIG: /run/secrets/rclone.conf
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./tmp:/app/tmp
      - ${RCLONE_CONFIG_HOST_PATH:-/home/ubuntu/.config/rclone/rclone.conf}:/run/secrets/rclone.conf:ro
    command: ["python", "-m", "app.jobs.preflight_observed"]

  pipeline-worker:
    profiles: ["web"]
    build:
      context: .
      dockerfile: Dockerfile
    image: course-transcript-pipeline-worker:local
    restart: unless-stopped
    stop_grace_period: 45s
    env_file:
      - path: ${AI_RUNTIME_DIR:-/opt/course-transcript/secrets/ai-runtime}/ai-active.env
        required: false
    environment:
      COURSE_TRANSCRIPT_DATA_DIR: /app/data
      COURSE_TRANSCRIPT_COST_LIMIT_USD: "200"
      COURSE_TRANSCRIPT_COST_WARNING_THRESHOLDS_USD: "50,100,160,190"
      COURSE_TRANSCRIPT_BUDGET_REMAINING_TWD: ${COURSE_TRANSCRIPT_BUDGET_REMAINING_TWD:-1200}
      COURSE_TRANSCRIPT_USD_TO_TWD: ${COURSE_TRANSCRIPT_USD_TO_TWD:-32}
      COURSE_TRANSCRIPT_BUDGET_BASELINE_COMMITTED_USD: ${COURSE_TRANSCRIPT_BUDGET_BASELINE_COMMITTED_USD:-132.6374}
      COURSE_TRANSCRIPT_FX_AUTO_ENABLED: ${COURSE_TRANSCRIPT_FX_AUTO_ENABLED:-true}
      COURSE_TRANSCRIPT_FX_URL: ${COURSE_TRANSCRIPT_FX_URL:-https://cpx.cbc.gov.tw/api/OpenData/FTDOpenData_Day}
      COURSE_TRANSCRIPT_FX_CACHE_TTL_SECONDS: ${COURSE_TRANSCRIPT_FX_CACHE_TTL_SECONDS:-86400}
      COURSE_TRANSCRIPT_FX_MAX_STALE_SECONDS: ${COURSE_TRANSCRIPT_FX_MAX_STALE_SECONDS:-259200}
      COURSE_TRANSCRIPT_FX_TIMEOUT_SECONDS: ${COURSE_TRANSCRIPT_FX_TIMEOUT_SECONDS:-5}
      COURSE_TRANSCRIPT_FX_CACHE_PATH: ${COURSE_TRANSCRIPT_FX_CACHE_PATH:-/app/data/fx/usd-twd.json}
      COURSE_TRANSCRIPT_MINIMUM_FREE_SPACE_GB: "3"
      COURSE_TRANSCRIPT_PIPELINE_WORKER_ID: "pipeline-worker-1"
      GOOGLE_APPLICATION_CREDENTIALS: /run/ai-runtime/gcp-sa.json
      AI_ACCOUNTS_DIR: ${AI_ACCOUNTS_DIR:-/opt/course-transcript/secrets/ai-accounts}
      RCLONE_CONFIG: /run/secrets/rclone.conf
      CHIRP_DYNAMIC_BATCHING: ${CHIRP_DYNAMIC_BATCHING:-true}
      CHIRP_DYNAMIC_MAX_INFLIGHT_JOBS: ${CHIRP_DYNAMIC_MAX_INFLIGHT_JOBS:-5}
      CHIRP_RECOVERY_POLL_SECONDS: ${CHIRP_RECOVERY_POLL_SECONDS:-120}
      CHIRP_PROVIDER_DEADLINE_SECONDS: ${CHIRP_PROVIDER_DEADLINE_SECONDS:-90000}
      CHIRP_OUTPUT_PROPAGATION_GRACE_SECONDS: ${CHIRP_OUTPUT_PROPAGATION_GRACE_SECONDS:-300}
      CHIRP_GCS_CLEANUP_AFTER_RECOVERY: ${CHIRP_GCS_CLEANUP_AFTER_RECOVERY:-true}
      CHIRP_MAX_PARALLEL_CHUNKS: ${CHIRP_MAX_PARALLEL_CHUNKS:-3}
      CHIRP_CANARY_DURATION_SECONDS: ${CHIRP_CANARY_DURATION_SECONDS:-120}
      CHIRP_MAX_PARALLEL_CHUNKS_LIMIT: ${CHIRP_MAX_PARALLEL_CHUNKS_LIMIT:-5}
      CHIRP_MAX_PARALLEL_RECOVERY: ${CHIRP_MAX_PARALLEL_RECOVERY:-3}
      GEMINI_CORRECTION_WINDOW_MS: ${GEMINI_CORRECTION_WINDOW_MS:-60000}
      GEMINI_MAX_PARALLEL_WINDOWS: ${GEMINI_MAX_PARALLEL_WINDOWS:-2}
      COURSE_TRANSCRIPT_AUTO_PUBLISH_TO_SOURCE: ${COURSE_TRANSCRIPT_AUTO_PUBLISH_TO_SOURCE:-true}
      CHIRP_SPEECH_ADAPTATION: ${CHIRP_SPEECH_ADAPTATION:-false}
      MINIMAX_M3_ENABLED: ${MINIMAX_M3_ENABLED:-false}
      MINIMAX_M3_QUOTA_CHECK_ENABLED: ${MINIMAX_M3_QUOTA_CHECK_ENABLED:-false}
      MINIMAX_M3_MODEL: ${MINIMAX_M3_MODEL:-MiniMax-M3}
      MINIMAX_M3_INVALID_RESPONSE_MAX_ATTEMPTS: ${MINIMAX_M3_INVALID_RESPONSE_MAX_ATTEMPTS:-2}
      MINIMAX_M3_QUOTA_URL: ${MINIMAX_M3_QUOTA_URL:-https://api.minimaxi.com/v1/token_plan/remains}
      MINIMAX_M3_API_PATH: ${MINIMAX_M3_API_PATH:-/v1/chat/completions}
      MINIMAX_API_BASE_URL: ${MINIMAX_API_BASE_URL:-https://api.minimaxi.com}
      MINIMAX_API_KEY_FILE: /run/secrets/minimax-api-key
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./tmp:/app/tmp
      - ${AI_RUNTIME_DIR:-/opt/course-transcript/secrets/ai-runtime}:${AI_RUNTIME_DIR:-/opt/course-transcript/secrets/ai-runtime}:ro
      - ${RCLONE_CONFIG_HOST_PATH:-/home/ubuntu/.config/rclone/rclone.conf}:/run/secrets/rclone.conf:ro
      - ${MINIMAX_API_KEY_HOST_PATH:-/opt/course-transcript/secrets/minimax-api-key}:/run/secrets/minimax-api-key:ro
    command: ["python", "-m", "app.pipeline.dynamic_worker_production"]

  delivery-worker:
    profiles: ["web"]
    build:
      context: .
      dockerfile: Dockerfile
    image: course-transcript-delivery-worker:local
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      COURSE_TRANSCRIPT_DATA_DIR: /app/data
      RCLONE_CONFIG: /run/secrets/rclone.conf
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ${RCLONE_CONFIG_HOST_PATH:-/home/ubuntu/.config/rclone/rclone.conf}:/run/secrets/rclone.conf:ro
    command: ["python", "-m", "app.jobs.delivery_worker", "--poll-seconds", "60"]

  health-monitor:
    profiles: ["web"]
    build:
      context: .
      dockerfile: Dockerfile
    image: course-transcript-pipeline-worker:local
    restart: unless-stopped
    environment:
      COURSE_TRANSCRIPT_DATA_DIR: /app/data
      PRODUCTION_HEALTH_POLL_SECONDS: ${PRODUCTION_HEALTH_POLL_SECONDS:-900}
      HEALTH_REQUIRE_SERVICE_HEARTBEATS: "true"
      HEALTH_SERVICE_HEARTBEAT_MAX_SECONDS: ${HEALTH_SERVICE_HEARTBEAT_MAX_SECONDS:-180}
    volumes:
      - ./data:/app/data
    command: ["sh", "-c", "while true; do python -m app.operations.production_health --output /app/data/production-health.json || true; sleep $${PRODUCTION_HEALTH_POLL_SECONDS}; done"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time,pathlib; p=pathlib.Path('/app/data/production-health.json'); d=json.loads(p.read_text()); assert d.get('status') != 'critical' and time.time()-__import__('datetime').datetime.fromisoformat(d['generated_at'].replace('Z','+00:00')).timestamp() < 1800"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 30s

  retention-monitor:
    profiles: ["web"]
    build:
      context: .
      dockerfile: Dockerfile
    image: course-transcript-pipeline-worker:local
    restart: unless-stopped
    environment:
      COURSE_TRANSCRIPT_DATA_DIR: /app/data
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
      GCS_BUCKET: ${GCS_BUCKET:-course-transcript-mvp}
      COURSE_TRANSCRIPT_RETENTION_POLL_SECONDS: ${COURSE_TRANSCRIPT_RETENTION_POLL_SECONDS:-86400}
    volumes:
      - ./data:/app/data
      - /opt/course-transcript/secrets/gcp-sa.json:/run/secrets/gcp-sa.json:ro
    # Always dry-run: deletion still requires an explicit, reviewed --apply.
    command: ["sh", "-c", "while true; do python -m app.operations.retention_cleanup --data-dir /app/data --output /app/data/retention-report.json || true; sleep $${COURSE_TRANSCRIPT_RETENTION_POLL_SECONDS}; done"]

  billing-worker:
    profiles: ["billing"]
    build:
      context: .
      dockerfile: Dockerfile
    image: course-transcript-billing-worker:local
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
    environment:
      COURSE_TRANSCRIPT_DATA_DIR: /app/data
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/billing-sa.json
      BILLING_GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/billing-sa.json
    volumes:
      - ./data:/app/data
      - ${BILLING_CREDENTIALS_HOST_PATH:-/opt/course-transcript/secrets/billing-sa.json}:/run/secrets/billing-sa.json:ro
    command: ["python", "-m", "app.billing.worker"]

  frontend:
    profiles: ["web"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      API_INTERNAL_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
      pipeline-worker:
        condition: service_started
      delivery-worker:
        condition: service_started
      health-monitor:
        condition: service_started
    ports:
      - "127.0.0.1:3300:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
