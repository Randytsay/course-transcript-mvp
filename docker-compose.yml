services:
  infrastructure-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: course-transcript-infrastructure-test:local
    env_file:
      - path: .env
        required: false
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
      CHIRP_DYNAMIC_BATCHING: ${CHIRP_DYNAMIC_BATCHING:-true}
    volumes:
      - /opt/course-transcript/secrets/gcp-sa.json:/run/secrets/gcp-sa.json:ro
      - ./logs:/app/logs
      - ./tmp:/app/tmp
      - ./data:/app/data
    command: []

  api:
    profiles: ["web"]
    build:
      context: .
      dockerfile: Dockerfile
    image: course-transcript-api:local
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      - path: .env
        required: false
    environment:
      COURSE_TRANSCRIPT_DATA_DIR: /app/data
      COURSE_TRANSCRIPT_CORS_ORIGINS: http://localhost:3000
      COURSE_TRANSCRIPT_COST_LIMIT_USD: "200"
      COURSE_TRANSCRIPT_COST_WARNING_THRESHOLDS_USD: "50,100,160,190"
      COURSE_TRANSCRIPT_ALLOWED_SOURCE_PREFIX: "gdrive:"
      COURSE_TRANSCRIPT_BATCH_MAX_FILES: "100"
      COURSE_TRANSCRIPT_DRIVE_BROWSE_MAX_ENTRIES: "500"
      COURSE_TRANSCRIPT_DRIVE_BROWSE_CACHE_SECONDS: "60"
      COURSE_TRANSCRIPT_DRIVE_BROWSER_PROVIDER: ${COURSE_TRANSCRIPT_DRIVE_BROWSER_PROVIDER:-google_api}
      COURSE_TRANSCRIPT_DRIVE_BROWSER_FALLBACK: ${COURSE_TRANSCRIPT_DRIVE_BROWSER_FALLBACK:-true}
      COURSE_TRANSCRIPT_DRIVE_REMOTE: ${COURSE_TRANSCRIPT_DRIVE_REMOTE:-gdrive}
      GOOGLE_DRIVE_PAGE_SIZE: ${GOOGLE_DRIVE_PAGE_SIZE:-200}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${GOOGLE_DRIVE_REFRESH_TOKEN:-}
      GOOGLE_DRIVE_REFRESH_TOKEN_FILE: ${GOOGLE_DRIVE_REFRESH_TOKEN_FILE:-}
      COURSE_TRANSCRIPT_RCLONE_FAST_LIST: "false"
      COURSE_TRANSCRIPT_REQUIRE_ACCESS_HEADERS: "true"
      COURSE_TRANSCRIPT_PUBLIC_ORIGIN: "https://transcript.randy88.ccwu.cc"
      CHIRP_DYNAMIC_BATCHING: ${CHIRP_DYNAMIC_BATCHING:-true}
      BILLING_SNAPSHOT_STALE_SECONDS: ${BILLING_SNAPSHOT_STALE_SECONDS:-3600}
      RCLONE_CONFIG: /run/secrets/rclone.conf
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-course-transcript-mvp}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GCS_BUCKET: ${GCS_BUCKET:-course-transcript-mvp}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs:ro
      - ${RCLONE_CONFIG_HOST_PATH:-/home/ubuntu/.config/rclone/rclone.conf}:/run/secrets/rclone.conf:ro
      - ${GOOGLE_DRIVE_REFRESH_TOKEN_HOST_PATH:-/dev/null}:/run/secrets/google-drive-refresh-token:ro
      - /opt/course-transcript/secrets/gcp-sa.json:/run/secrets/gcp-sa.json:ro
    command: ["uvicorn", "app.api_hardened:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    profiles: ["web"]
    build:
      context: .
      dockerfile: Dockerfile
    image: course-transcript-worker:local
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      COURSE_TRANSCRIPT_DATA_DIR: /app/data
      COURSE_TRANSCRIPT_COST_LIMIT_USD: "200"
      COURSE_TRANSCRIPT_COST_WARNING_THRESHOLDS_USD: "50,100,160,190"
      COURSE_TRANSCRIPT_MINIMUM_FREE_SPACE_GB: "3"
      COURSE_TRANSCRIPT_WORKER_ID: "preflight-worker-1"
      CHIRP_DYNAMIC_BATCHING: ${CHIRP_DYNAMIC_BATCHING:-true}
      RCLONE_CONFIG: /run/secrets/rclone.conf
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./tmp:/app/tmp
      - ${RCLONE_CONFIG_HOST_PATH:-/home/ubuntu/.config/rclone/rclone.conf}:/run/secrets/rclone.conf:ro
    command: ["python", "-m", "app.jobs.preflight_observed"]

  pipeline-worker:
    profiles: ["web"]
    build:
      context: .
      dockerfile: Dockerfile
    image: course-transcript-pipeline-worker:local
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      COURSE_TRANSCRIPT_DATA_DIR: /app/data
      COURSE_TRANSCRIPT_COST_LIMIT_USD: "200"
      COURSE_TRANSCRIPT_COST_WARNING_THRESHOLDS_USD: "50,100,160,190"
      COURSE_TRANSCRIPT_MINIMUM_FREE_SPACE_GB: "3"
      COURSE_TRANSCRIPT_PIPELINE_WORKER_ID: "pipeline-worker-1"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-course-transcript-mvp}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GCS_BUCKET: ${GCS_BUCKET:-course-transcript-mvp}
      RCLONE_CONFIG: /run/secrets/rclone.conf
      CHIRP_DYNAMIC_BATCHING: ${CHIRP_DYNAMIC_BATCHING:-true}
      CHIRP_DYNAMIC_MAX_INFLIGHT_JOBS: ${CHIRP_DYNAMIC_MAX_INFLIGHT_JOBS:-5}
      CHIRP_RECOVERY_POLL_SECONDS: ${CHIRP_RECOVERY_POLL_SECONDS:-120}
      CHIRP_PROVIDER_DEADLINE_SECONDS: ${CHIRP_PROVIDER_DEADLINE_SECONDS:-90000}
      CHIRP_OUTPUT_PROPAGATION_GRACE_SECONDS: ${CHIRP_OUTPUT_PROPAGATION_GRACE_SECONDS:-300}
      CHIRP_GCS_CLEANUP_AFTER_RECOVERY: ${CHIRP_GCS_CLEANUP_AFTER_RECOVERY:-true}
      CHIRP_MAX_PARALLEL_CHUNKS: ${CHIRP_MAX_PARALLEL_CHUNKS:-3}
      CHIRP_CANARY_DURATION_SECONDS: ${CHIRP_CANARY_DURATION_SECONDS:-120}
      CHIRP_MAX_PARALLEL_CHUNKS_LIMIT: ${CHIRP_MAX_PARALLEL_CHUNKS_LIMIT:-5}
      CHIRP_MAX_PARALLEL_RECOVERY: ${CHIRP_MAX_PARALLEL_RECOVERY:-3}
      GEMINI_CORRECTION_WINDOW_MS: ${GEMINI_CORRECTION_WINDOW_MS:-60000}
      GEMINI_MAX_PARALLEL_WINDOWS: ${GEMINI_MAX_PARALLEL_WINDOWS:-2}
      COURSE_TRANSCRIPT_AUTO_PUBLISH_TO_SOURCE: ${COURSE_TRANSCRIPT_AUTO_PUBLISH_TO_SOURCE:-true}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./tmp:/app/tmp
      - /opt/course-transcript/secrets/gcp-sa.json:/run/secrets/gcp-sa.json:ro
      - ${RCLONE_CONFIG_HOST_PATH:-/home/ubuntu/.config/rclone/rclone.conf}:/run/secrets/rclone.conf:ro
    command: ["python", "-m", "app.pipeline.dynamic_worker_production"]

  delivery-worker:
    profiles: ["web"]
    build:
      context: .
      dockerfile: Dockerfile
    image: course-transcript-delivery-worker:local
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      COURSE_TRANSCRIPT_DATA_DIR: /app/data
      RCLONE_CONFIG: /run/secrets/rclone.conf
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ${RCLONE_CONFIG_HOST_PATH:-/home/ubuntu/.config/rclone/rclone.conf}:/run/secrets/rclone.conf:ro
    command: ["python", "-m", "app.jobs.delivery_worker", "--poll-seconds", "60"]

  billing-worker:
    profiles: ["billing"]
    build:
      context: .
      dockerfile: Dockerfile
    image: course-transcript-billing-worker:local
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
    environment:
      COURSE_TRANSCRIPT_DATA_DIR: /app/data
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/billing-sa.json
      BILLING_GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/billing-sa.json
    volumes:
      - ./data:/app/data
      - ${BILLING_CREDENTIALS_HOST_PATH:-/opt/course-transcript/secrets/billing-sa.json}:/run/secrets/billing-sa.json:ro
    command: ["python", "-m", "app.billing.worker"]

  frontend:
    profiles: ["web"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      API_INTERNAL_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
      pipeline-worker:
        condition: service_started
      delivery-worker:
        condition: service_started
    ports:
      - "127.0.0.1:3300:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
