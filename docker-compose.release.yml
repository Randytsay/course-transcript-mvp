services:
  infrastructure-test:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETARCH: ${COURSE_TRANSCRIPT_TARGETARCH:-arm64}
        RCLONE_RELEASE: ${RCLONE_RELEASE:-1.74.0}
        VCS_REF: ${COURSE_TRANSCRIPT_RELEASE_TAG:?Set COURSE_TRANSCRIPT_RELEASE_TAG to the exact approved Git SHA}
    image: course-transcript-infrastructure-test:${COURSE_TRANSCRIPT_RELEASE_TAG:?Set COURSE_TRANSCRIPT_RELEASE_TAG to the exact approved Git SHA}
    env_file:
      - path: ${COURSE_TRANSCRIPT_ENV_FILE:?Set COURSE_TRANSCRIPT_ENV_FILE to the protected production env file}
        required: true
    volumes:
      - ${AI_RUNTIME_DIR:-/opt/course-transcript/secrets/ai-runtime}:${AI_RUNTIME_DIR:-/opt/course-transcript/secrets/ai-runtime}:ro
      - ${AI_PROVIDER_PROFILES_DIR:-/opt/course-transcript/secrets/ai-providers}:${AI_PROVIDER_PROFILES_DIR:-/opt/course-transcript/secrets/ai-providers}:ro
      - ${COURSE_TRANSCRIPT_LOGS_HOST_PATH:?Set COURSE_TRANSCRIPT_LOGS_HOST_PATH}:/app/logs
      - ${COURSE_TRANSCRIPT_TMP_HOST_PATH:?Set COURSE_TRANSCRIPT_TMP_HOST_PATH}:/app/tmp
      - ${COURSE_TRANSCRIPT_DATA_HOST_PATH:?Set COURSE_TRANSCRIPT_DATA_HOST_PATH}:/app/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETARCH: ${COURSE_TRANSCRIPT_TARGETARCH:-arm64}
        RCLONE_RELEASE: ${RCLONE_RELEASE:-1.74.0}
        VCS_REF: ${COURSE_TRANSCRIPT_RELEASE_TAG:?Set COURSE_TRANSCRIPT_RELEASE_TAG to the exact approved Git SHA}
    image: course-transcript-api:${COURSE_TRANSCRIPT_RELEASE_TAG:?Set COURSE_TRANSCRIPT_RELEASE_TAG to the exact approved Git SHA}
    env_file:
      - path: ${COURSE_TRANSCRIPT_ENV_FILE:?Set COURSE_TRANSCRIPT_ENV_FILE to the protected production env file}
        required: true
      - path: ${AI_RUNTIME_DIR:-/opt/course-transcript/secrets/ai-runtime}/ai-active.env
        required: false
    environment:
      COURSE_TRANSCRIPT_RUNTIME_GIT_SHA: ${COURSE_TRANSCRIPT_RELEASE_TAG}
      COURSE_TRANSCRIPT_DOCKER_IMAGE_REVISION: ${COURSE_TRANSCRIPT_RELEASE_TAG}
      GOOGLE_APPLICATION_CREDENTIALS: /run/ai-runtime/gcp-sa.json
      AI_RUNTIME_DIR: ${AI_RUNTIME_DIR:-/opt/course-transcript/secrets/ai-runtime}
      AI_ACCOUNTS_DIR: ${AI_ACCOUNTS_DIR:-/opt/course-transcript/secrets/ai-accounts}
    volumes:
      - ${COURSE_TRANSCRIPT_DATA_HOST_PATH:?Set COURSE_TRANSCRIPT_DATA_HOST_PATH}:/app/data
      - ${COURSE_TRANSCRIPT_LOGS_HOST_PATH:?Set COURSE_TRANSCRIPT_LOGS_HOST_PATH}:/app/logs:ro
      - ${RCLONE_CONFIG_HOST_PATH:?Set RCLONE_CONFIG_HOST_PATH}:/run/secrets/rclone.conf:ro
      - ${GOOGLE_DRIVE_REFRESH_TOKEN_HOST_PATH:-/dev/null}:/run/secrets/google-drive-refresh-token:ro
      - ${MINIMAX_API_KEY_HOST_PATH:-/opt/course-transcript/secrets/minimax-api-key}:/run/secrets/minimax-api-key:ro
      # AI profile state: only this subtree is writable by the API.
      - ${AI_ACCOUNTS_DIR:-/opt/course-transcript/secrets/ai-accounts}:${AI_ACCOUNTS_DIR:-/opt/course-transcript/secrets/ai-accounts}
      - ${AI_RUNTIME_DIR:-/opt/course-transcript/secrets/ai-runtime}:${AI_RUNTIME_DIR:-/opt/course-transcript/secrets/ai-runtime}
      - ${AI_PROVIDER_PROFILES_DIR:-/opt/course-transcript/secrets/ai-providers}:${AI_PROVIDER_PROFILES_DIR:-/opt/course-transcript/secrets/ai-providers}

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETARCH: ${COURSE_TRANSCRIPT_TARGETARCH:-arm64}
        RCLONE_RELEASE: ${RCLONE_RELEASE:-1.74.0}
        VCS_REF: ${COURSE_TRANSCRIPT_RELEASE_TAG:?Set COURSE_TRANSCRIPT_RELEASE_TAG to the exact approved Git SHA}
    image: course-transcript-worker:${COURSE_TRANSCRIPT_RELEASE_TAG:?Set COURSE_TRANSCRIPT_RELEASE_TAG to the exact approved Git SHA}
    environment:
      COURSE_TRANSCRIPT_RUNTIME_GIT_SHA: ${COURSE_TRANSCRIPT_RELEASE_TAG}
      COURSE_TRANSCRIPT_DOCKER_IMAGE_REVISION: ${COURSE_TRANSCRIPT_RELEASE_TAG}
    volumes:
      - ${COURSE_TRANSCRIPT_DATA_HOST_PATH:?Set COURSE_TRANSCRIPT_DATA_HOST_PATH}:/app/data
      - ${COURSE_TRANSCRIPT_LOGS_HOST_PATH:?Set COURSE_TRANSCRIPT_LOGS_HOST_PATH}:/app/logs
      - ${COURSE_TRANSCRIPT_TMP_HOST_PATH:?Set COURSE_TRANSCRIPT_TMP_HOST_PATH}:/app/tmp
      - ${RCLONE_CONFIG_HOST_PATH:?Set RCLONE_CONFIG_HOST_PATH}:/run/secrets/rclone.conf:ro

  pipeline-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETARCH: ${COURSE_TRANSCRIPT_TARGETARCH:-arm64}
        RCLONE_RELEASE: ${RCLONE_RELEASE:-1.74.0}
        VCS_REF: ${COURSE_TRANSCRIPT_RELEASE_TAG:?Set COURSE_TRANSCRIPT_RELEASE_TAG to the exact approved Git SHA}
    image: course-transcript-pipeline-worker:${COURSE_TRANSCRIPT_RELEASE_TAG:?Set COURSE_TRANSCRIPT_RELEASE_TAG to the exact approved Git SHA}
    env_file:
      - path: ${AI_RUNTIME_DIR:-/opt/course-transcript/secrets/ai-runtime}/ai-active.env
        required: false
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/ai-runtime/gcp-sa.json
      COURSE_TRANSCRIPT_RUNTIME_GIT_SHA: ${COURSE_TRANSCRIPT_RELEASE_TAG}
      COURSE_TRANSCRIPT_DOCKER_IMAGE_REVISION: ${COURSE_TRANSCRIPT_RELEASE_TAG}
    volumes:
      - ${COURSE_TRANSCRIPT_DATA_HOST_PATH:?Set COURSE_TRANSCRIPT_DATA_HOST_PATH}:/app/data
      - ${COURSE_TRANSCRIPT_LOGS_HOST_PATH:?Set COURSE_TRANSCRIPT_LOGS_HOST_PATH}:/app/logs
      - ${COURSE_TRANSCRIPT_TMP_HOST_PATH:?Set COURSE_TRANSCRIPT_TMP_HOST_PATH}:/app/tmp
      - ${AI_RUNTIME_DIR:-/opt/course-transcript/secrets/ai-runtime}:${AI_RUNTIME_DIR:-/opt/course-transcript/secrets/ai-runtime}:ro
      - ${AI_PROVIDER_PROFILES_DIR:-/opt/course-transcript/secrets/ai-providers}:${AI_PROVIDER_PROFILES_DIR:-/opt/course-transcript/secrets/ai-providers}:ro
      - ${RCLONE_CONFIG_HOST_PATH:?Set RCLONE_CONFIG_HOST_PATH}:/run/secrets/rclone.conf:ro
      - ${MINIMAX_API_KEY_HOST_PATH:-/opt/course-transcript/secrets/minimax-api-key}:/run/secrets/minimax-api-key:ro

  delivery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETARCH: ${COURSE_TRANSCRIPT_TARGETARCH:-arm64}
        RCLONE_RELEASE: ${RCLONE_RELEASE:-1.74.0}
        VCS_REF: ${COURSE_TRANSCRIPT_RELEASE_TAG:?Set COURSE_TRANSCRIPT_RELEASE_TAG to the exact approved Git SHA}
    image: course-transcript-delivery-worker:${COURSE_TRANSCRIPT_RELEASE_TAG:?Set COURSE_TRANSCRIPT_RELEASE_TAG to the exact approved Git SHA}
    environment:
      COURSE_TRANSCRIPT_RUNTIME_GIT_SHA: ${COURSE_TRANSCRIPT_RELEASE_TAG}
      COURSE_TRANSCRIPT_DOCKER_IMAGE_REVISION: ${COURSE_TRANSCRIPT_RELEASE_TAG}
    volumes:
      - ${COURSE_TRANSCRIPT_DATA_HOST_PATH:?Set COURSE_TRANSCRIPT_DATA_HOST_PATH}:/app/data
      - ${COURSE_TRANSCRIPT_LOGS_HOST_PATH:?Set COURSE_TRANSCRIPT_LOGS_HOST_PATH}:/app/logs
      - ${RCLONE_CONFIG_HOST_PATH:?Set RCLONE_CONFIG_HOST_PATH}:/run/secrets/rclone.conf:ro

  health-monitor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETARCH: ${COURSE_TRANSCRIPT_TARGETARCH:-arm64}
        RCLONE_RELEASE: ${RCLONE_RELEASE:-1.74.0}
        VCS_REF: ${COURSE_TRANSCRIPT_RELEASE_TAG:?Set COURSE_TRANSCRIPT_RELEASE_TAG to the exact approved Git SHA}
    image: course-transcript-pipeline-worker:${COURSE_TRANSCRIPT_RELEASE_TAG:?Set COURSE_TRANSCRIPT_RELEASE_TAG to the exact approved Git SHA}
    volumes:
      - ${COURSE_TRANSCRIPT_DATA_HOST_PATH:?Set COURSE_TRANSCRIPT_DATA_HOST_PATH}:/app/data

  retention-monitor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETARCH: ${COURSE_TRANSCRIPT_TARGETARCH:-arm64}
        RCLONE_RELEASE: ${RCLONE_RELEASE:-1.74.0}
        VCS_REF: ${COURSE_TRANSCRIPT_RELEASE_TAG:?Set COURSE_TRANSCRIPT_RELEASE_TAG to the exact approved Git SHA}
    image: course-transcript-pipeline-worker:${COURSE_TRANSCRIPT_RELEASE_TAG:?Set COURSE_TRANSCRIPT_RELEASE_TAG to the exact approved Git SHA}
    volumes:
      - ${COURSE_TRANSCRIPT_DATA_HOST_PATH:?Set COURSE_TRANSCRIPT_DATA_HOST_PATH}:/app/data
      - ${AI_RUNTIME_DIR:-/opt/course-transcript/secrets/ai-runtime}:${AI_RUNTIME_DIR:-/opt/course-transcript/secrets/ai-runtime}:ro
      - ${AI_PROVIDER_PROFILES_DIR:-/opt/course-transcript/secrets/ai-providers}:${AI_PROVIDER_PROFILES_DIR:-/opt/course-transcript/secrets/ai-providers}:ro

  billing-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETARCH: ${COURSE_TRANSCRIPT_TARGETARCH:-arm64}
        RCLONE_RELEASE: ${RCLONE_RELEASE:-1.74.0}
        VCS_REF: ${COURSE_TRANSCRIPT_RELEASE_TAG:?Set COURSE_TRANSCRIPT_RELEASE_TAG to the exact approved Git SHA}
    image: course-transcript-billing-worker:${COURSE_TRANSCRIPT_RELEASE_TAG:?Set COURSE_TRANSCRIPT_RELEASE_TAG to the exact approved Git SHA}
    env_file:
      - path: ${COURSE_TRANSCRIPT_ENV_FILE:?Set COURSE_TRANSCRIPT_ENV_FILE to the protected production env file}
        required: true
    volumes:
      - ${COURSE_TRANSCRIPT_DATA_HOST_PATH:?Set COURSE_TRANSCRIPT_DATA_HOST_PATH}:/app/data
      - ${BILLING_CREDENTIALS_HOST_PATH:?Set BILLING_CREDENTIALS_HOST_PATH}:/run/secrets/billing-sa.json:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VCS_REF: ${COURSE_TRANSCRIPT_RELEASE_TAG:?Set COURSE_TRANSCRIPT_RELEASE_TAG to the exact approved Git SHA}
    image: course-transcript-frontend:${COURSE_TRANSCRIPT_RELEASE_TAG:?Set COURSE_TRANSCRIPT_RELEASE_TAG to the exact approved Git SHA}
