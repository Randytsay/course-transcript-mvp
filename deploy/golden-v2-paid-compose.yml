# Opt-in runtime overlay. Merely adding this file must not dispatch paid work
# or publish Drive files; both require a selected profile and owner grant.
services:
  api:
    env_file:
      - ${V2_CHAT_GRANT_ENV_FILE:-/opt/course-transcript-v2-chat/secrets/grant.env}
    environment:
      COURSE_TRANSCRIPT_V2_PAID_API_ENABLED: ${V2_CHAT_PAID_API_ENABLED:-false}
      COURSE_TRANSCRIPT_V2_PUBLISH_API_ENABLED: ${V2_CHAT_PUBLISH_API_ENABLED:-false}
      COURSE_TRANSCRIPT_V2_AI_PUBLISH_API_ENABLED: ${V2_CHAT_AI_PUBLISH_API_ENABLED:-false}
      COURSE_TRANSCRIPT_V2_AI_DRAFT_API_ENABLED: ${V2_CHAT_AI_DRAFT_API_ENABLED:-false}
  paid:
    profiles: [v2-paid]
    image: course-transcript-v2-runtime:${V2_CHAT_RELEASE_SHA:?exact release required}
    restart: unless-stopped
    stop_grace_period: 45s
    env_file:
      - ${V2_CHAT_GRANT_ENV_FILE:-/opt/course-transcript-v2-chat/secrets/grant.env}
    environment:
      COURSE_TRANSCRIPT_V2_ARTIFACT_ROOT: /app/data/golden-v2
      GOOGLE_APPLICATION_CREDENTIALS: /run/ai-runtime/gcp-sa.json
      GOOGLE_CLOUD_PROJECT: xenon-chain-506409-c3
      GOOGLE_CLOUD_PROJECT_NUMBER: '608343797618'
      GCS_BUCKET: xenon-chain-506409-c3-golden-v2-smoke
      RCLONE_CONFIG: /run/secrets/rclone.conf
    volumes:
      - ${V2_CHAT_DATA_DIR:-/opt/course-transcript-v2-chat/data}:/app/data
      - /opt/course-transcript/secrets/ai-runtime:/run/ai-runtime:ro
      - ${V2_CHAT_DRIVE_CONFIG:-/home/ubuntu/.config/rclone/rclone.conf}:/run/secrets/rclone.conf:ro
    command: [python, scripts/golden_v2_paid_executor_daemon.py, --database, /app/data/golden-v2/ledger.sqlite, --artifact-root, /app/data/golden-v2, --services-module, app.pipeline.golden_v2_runtime_services, --aggregate-cap-cents, '1000', --enable-paid, --auto-rescue-known-refusal]
  delivery:
    profiles: [v2-publish]
    image: course-transcript-v2-chat:${V2_CHAT_RELEASE_SHA:?exact release required}
    restart: unless-stopped
    env_file:
      - ${V2_CHAT_GRANT_ENV_FILE:-/opt/course-transcript-v2-chat/secrets/grant.env}
    environment:
      RCLONE_CONFIG: /run/secrets/rclone.conf
      COURSE_TRANSCRIPT_V2_AI_DELIVERY_ENABLED: ${V2_CHAT_AI_DELIVERY_ENABLED:-false}
    volumes:
      - ${V2_CHAT_DATA_DIR:-/opt/course-transcript-v2-chat/data}:/app/data
      - ${V2_CHAT_DRIVE_CONFIG:-/home/ubuntu/.config/rclone/rclone.conf}:/run/secrets/rclone.conf:ro
      - /opt/course-transcript-source/data/locks:/app/drive-lock-state/locks
    command: [python, scripts/golden_v2_delivery_daemon.py, --artifact-root, /app/data/golden-v2, --lock-root, /app/drive-lock-state, --enable-publication, --enable-ai-publication]
